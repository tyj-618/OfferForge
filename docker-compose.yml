services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: offerforge-backend
    restart: unless-stopped
    ports:
      - "${OFFERFORGE_BIND_ADDRESS:-127.0.0.1}:${OFFERFORGE_BACKEND_PORT:-8080}:8080"
    environment:
      SERVER_PORT: 8080
      # redis profile：限流/会话/消息存储使用 Redis 实现（否则内存实现）
      SPRING_PROFILES_ACTIVE: redis
      OFFERFORGE_DB_URL: jdbc:mysql://mysql:3306/offerforge?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      OFFERFORGE_DB_USERNAME: root
      OFFERFORGE_DB_PASSWORD: ${OFFERFORGE_DB_PASSWORD:-offerforge_dev_pwd}
      OFFERFORGE_REDIS_HOST: redis
      OFFERFORGE_REDIS_PORT: 6379
      OFFERFORGE_AI_PROVIDER: ${OFFERFORGE_AI_PROVIDER:-mock}
      OFFERFORGE_AI_BASE_URL: ${OFFERFORGE_AI_BASE_URL:-}
      OFFERFORGE_AI_API_KEY: ${OFFERFORGE_AI_API_KEY:-}
      OFFERFORGE_AI_MODEL: ${OFFERFORGE_AI_MODEL:-}
      OFFERFORGE_SEARCH_ENABLED: ${OFFERFORGE_SEARCH_ENABLED:-false}
      OFFERFORGE_SEARCH_BASE_URL: http://elasticsearch:9200
      OFFERFORGE_SEARCH_EMBEDDING_PROVIDER: ${OFFERFORGE_SEARCH_EMBEDDING_PROVIDER:-mock}
      OFFERFORGE_SEARCH_EMBEDDING_BASE_URL: ${OFFERFORGE_SEARCH_EMBEDDING_BASE_URL:-}
      OFFERFORGE_SEARCH_EMBEDDING_API_KEY: ${OFFERFORGE_SEARCH_EMBEDDING_API_KEY:-}
      OFFERFORGE_SEARCH_EMBEDDING_MODEL: ${OFFERFORGE_SEARCH_EMBEDDING_MODEL:-text-embedding-v4}
      # 免费额度与用户自带 Key 加密（密钥必须 32 字符，生产必须替换）
      OFFERFORGE_QUOTA_ENABLED: ${OFFERFORGE_QUOTA_ENABLED:-true}
      OFFERFORGE_QUOTA_DAILY_LIMIT: ${OFFERFORGE_QUOTA_DAILY_LIMIT:-10}
      # 付费计费：支付渠道审核通过前置 false，通过后改 OFFERFORGE_BILLING_ENABLED=true 即上线
      OFFERFORGE_BILLING_ENABLED: ${OFFERFORGE_BILLING_ENABLED:-false}
      OFFERFORGE_BILLING_PROVIDER: ${OFFERFORGE_BILLING_PROVIDER:-mock}
      OFFERFORGE_BILLING_MARKUP: ${OFFERFORGE_BILLING_MARKUP:-1.2}
      APIKEY_ENCRYPT_KEY: ${APIKEY_ENCRYPT_KEY:-offerforge-dev-aes256-gcm-key!!!}
      TZ: Asia/Shanghai
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: offerforge-frontend
    restart: unless-stopped
    ports:
      - "${OFFERFORGE_BIND_ADDRESS:-0.0.0.0}:${OFFERFORGE_FRONTEND_PORT:-80}:80"
    depends_on:
      - backend

  mysql:
    image: mysql:8.0
    container_name: offerforge-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${OFFERFORGE_DB_PASSWORD:-offerforge_dev_pwd}
      MYSQL_DATABASE: offerforge
      TZ: Asia/Shanghai
    ports:
      - "${OFFERFORGE_BIND_ADDRESS:-127.0.0.1}:${OFFERFORGE_MYSQL_PORT:-3308}:3306"
    volumes:
      - offerforge-mysql-data:/var/lib/mysql
      # 初始化：建表（知识库初始数据为用户维度，注册后在页面点击「导入内置知识库」）
      - ./src/main/resources/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7.4-alpine
    container_name: offerforge-redis
    restart: unless-stopped
    ports:
      - "${OFFERFORGE_BIND_ADDRESS:-127.0.0.1}:${OFFERFORGE_REDIS_PORT:-6380}:6379"
    volumes:
      - offerforge-redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.8
    container_name: offerforge-elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      # 开发环境关闭安全认证
      xpack.security.enabled: "false"
      xpack.security.enrollment.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "${OFFERFORGE_BIND_ADDRESS:-127.0.0.1}:${OFFERFORGE_ES_PORT:-9201}:9200"
    volumes:
      - offerforge-elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health?wait_for_status=yellow\\&timeout=1s >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 45s

volumes:
  offerforge-mysql-data:
  offerforge-redis-data:
  offerforge-elasticsearch-data:
