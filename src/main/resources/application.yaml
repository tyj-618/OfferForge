spring:
  application:
    name: OfferForge

  datasource:
    url: ${OFFERFORGE_DB_URL:jdbc:mysql://localhost:3308/offerforge?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${OFFERFORGE_DB_USERNAME:root}
    password: ${OFFERFORGE_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: ${OFFERFORGE_REDIS_HOST:localhost}
      port: ${OFFERFORGE_REDIS_PORT:6380}
      password: ${OFFERFORGE_REDIS_PASSWORD:}
      database: ${OFFERFORGE_REDIS_DATABASE:0}

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

  web:
    multipart:
      # 资料库上传：单文件 1MB 上限（仅接受 .md/.txt）
      max-file-size: 1MB
      max-request-size: 2MB

server:
  port: ${SERVER_PORT:8081}
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force-response: true

# 统一日志格式：[requestId] [userId] [interviewId] [level] message（requestId/userId 由 RequestIdFilter 写入 MDC）
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{requestId:-}] [%X{userId:-}] [%X{interviewId:-}] %logger{36} : %msg%n"
    level: "%5p"

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

offerforge:
  auth:
    refresh-cookie-secure: ${OFFERFORGE_AUTH_REFRESH_COOKIE_SECURE:false}
    access-token-ttl-seconds: ${OFFERFORGE_AUTH_ACCESS_TOKEN_TTL_SECONDS:7200}
    refresh-token-ttl-seconds: ${OFFERFORGE_AUTH_REFRESH_TOKEN_TTL_SECONDS:604800}
  # 管理台：逗号分隔的管理员名单（用户名或邮箱均可），未配置时无人具备管理员权限；
  # bootstrap 开启时启动即确保唯一管理账号（admin / 3520097134@qq.com / 123456）
  admin:
    usernames: ${OFFERFORGE_ADMIN_USERNAMES:}
    bootstrap:
      enabled: ${OFFERFORGE_ADMIN_BOOTSTRAP_ENABLED:false}
  ai:
    provider: ${OFFERFORGE_AI_PROVIDER:mock}
    base-url: ${OFFERFORGE_AI_BASE_URL:}
    api-key: ${OFFERFORGE_AI_API_KEY:}
    model: ${OFFERFORGE_AI_MODEL:}
    timeout-seconds: ${OFFERFORGE_AI_TIMEOUT_SECONDS:30}
    stream-read-timeout-seconds: ${OFFERFORGE_AI_STREAM_READ_TIMEOUT_SECONDS:60}
    max-retries: ${OFFERFORGE_AI_MAX_RETRIES:1}
    max-output-tokens: ${OFFERFORGE_AI_MAX_OUTPUT_TOKENS:1024}
    # DeepSeek 官方 OpenAI 兼容接口：价目目录中 provider=deepseek 的模型走此端点；
    # 未配置 api-key 时目录模型回退系统默认端点（降级不报错）
    deepseek:
      base-url: ${OFFERFORGE_DEEPSEEK_BASE_URL:https://api.deepseek.com}
      api-key: ${OFFERFORGE_DEEPSEEK_API_KEY:}
  search:
    enabled: ${OFFERFORGE_SEARCH_ENABLED:false}
    base-url: ${OFFERFORGE_SEARCH_BASE_URL:http://localhost:9201}
    knowledge-index: ${OFFERFORGE_SEARCH_KNOWLEDGE_INDEX:offerforge-knowledge}
    request-timeout-seconds: ${OFFERFORGE_SEARCH_REQUEST_TIMEOUT_SECONDS:5}
    embedding-dimensions: ${OFFERFORGE_SEARCH_EMBEDDING_DIMENSIONS:1024}
    embedding-provider: ${OFFERFORGE_SEARCH_EMBEDDING_PROVIDER:mock}
    embedding-base-url: ${OFFERFORGE_SEARCH_EMBEDDING_BASE_URL:}
    embedding-api-key: ${OFFERFORGE_SEARCH_EMBEDDING_API_KEY:}
    embedding-model: ${OFFERFORGE_SEARCH_EMBEDDING_MODEL:text-embedding-v4}
    embedding-timeout-seconds: ${OFFERFORGE_SEARCH_EMBEDDING_TIMEOUT_SECONDS:20}
  interview:
    max-follow-ups: ${OFFERFORGE_INTERVIEW_MAX_FOLLOW_UPS:2}
    max-basics-questions: ${OFFERFORGE_INTERVIEW_MAX_BASICS_QUESTIONS:3}
    max-project-questions: ${OFFERFORGE_INTERVIEW_MAX_PROJECT_QUESTIONS:2}
    max-deep-questions: ${OFFERFORGE_INTERVIEW_MAX_DEEP_QUESTIONS:3}
    message-window: ${OFFERFORGE_INTERVIEW_MESSAGE_WINDOW:12}
    # 会话 TTL（任务 4）：延长至 24h，支撑「深入模块」暂存面试与续考恢复
    session-ttl-seconds: ${OFFERFORGE_INTERVIEW_SESSION_TTL_SECONDS:86400}
  training:
    # 专项训练（任务 7）：单场最多出题数与会话长 TTL（刷新/暂离恢复）
    max-questions: ${OFFERFORGE_TRAINING_MAX_QUESTIONS:6}
    session-ttl-seconds: ${OFFERFORGE_TRAINING_SESSION_TTL_SECONDS:86400}
  rate-limit:
    # 按用户滑动窗口限流（window-millis 窗口内）；报告 history/progress 不限流
    interview-ask-limit: ${OFFERFORGE_RATE_LIMIT_INTERVIEW_ASK:10}
    qa-ask-limit: ${OFFERFORGE_RATE_LIMIT_QA_ASK:5}
    report-limit: ${OFFERFORGE_RATE_LIMIT_REPORT:60}
    window-millis: ${OFFERFORGE_RATE_LIMIT_WINDOW_MILLIS:60000}
  quota:
    # 免费额度：无自带 Key 的用户每日完整面试次数上限
    enabled: ${OFFERFORGE_QUOTA_ENABLED:true}
    daily-limit: ${OFFERFORGE_QUOTA_DAILY_LIMIT:10}
  billing:
    # 付费计费总开关：支付渠道审核通过前置 false（接口就绪不开放入口），通过后改环境变量即上线
    enabled: ${OFFERFORGE_BILLING_ENABLED:false}
    # 支付渠道：mock=模拟支付（审核期联调），wechat=微信支付（凭据到位后切换）
    provider: ${OFFERFORGE_BILLING_PROVIDER:mock}
    # 成本加成率：按模型调用成本的该倍数收费（1.2 = 120%）
    markup: ${OFFERFORGE_BILLING_MARKUP:1.2}
    # 充值档位（金额单位：分）
    packages:
      - id: pkg-10
        name: "¥10"
        amount-cents: 1000
      - id: pkg-50
        name: "¥50"
        amount-cents: 5000
      - id: pkg-100
        name: "¥100"
        amount-cents: 10000
    # 模型价目目录（百炼公开价，单位：分/百万 token）；paid-only=true 需充值后才可选用；
    # 计费时价目缺失回退首个免费档，系统默认模型（OFFERFORGE_AI_MODEL）按默认档计价
    models:
      - id: qwen-flash
        name: "通义千问-Flash（默认免费档）"
        input-per-million-cents: 15
        output-per-million-cents: 60
        paid-only: false
      - id: qwen-plus
        name: "通义千问-Plus（付费）"
        input-per-million-cents: 80
        output-per-million-cents: 200
        paid-only: true
      - id: qwen-max
        name: "通义千问-Max（付费）"
        input-per-million-cents: 240
        output-per-million-cents: 960
        paid-only: true
      - id: deepseek-v4-flash
        name: "DeepSeek-V4-Flash（付费）"
        input-per-million-cents: 20
        output-per-million-cents: 80
        paid-only: true
        provider: deepseek
  encryption:
    # API Key 加密密钥：必须 32 字节 UTF-8（AES-256），生产环境必须替换默认值
    key: ${APIKEY_ENCRYPT_KEY:}

# 腾讯云 SES 邮件推送（邮箱验证码）：凭据仅通过环境变量注入（禁止入库），
# 生产（redis profile）必须配置 TENCENT_SECRET_ID/TENCENT_SECRET_KEY，否则发信失败；
# 未开通「自定义发送」权限的账号必须配置 TENCENT_SES_TEMPLATE_ID（控制台已审核模板，内容含 {code} 变量）
tencent:
  ses:
    secret-id: ${TENCENT_SECRET_ID:}
    secret-key: ${TENCENT_SECRET_KEY:}
    region: ${TENCENT_SES_REGION:ap-hongkong}
    from-email: ${TENCENT_SES_FROM_EMAIL:noreply@easyofferforge.com}
    template-id: ${TENCENT_SES_TEMPLATE_ID:}
