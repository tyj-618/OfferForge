spring:
  datasource:
    # 随机命名内存库：每个 Spring 上下文解析出独立库名（上下文隔离），
    # 且同一上下文的连接池内所有连接共享同一库（匿名库 jdbc:h2:mem: 是每连接私有，与 Hikari 不兼容）；
    # 避免多上下文共享命名库时 create-drop 重置自增 ID 与会话存储交叉污染
    url: jdbc:h2:mem:${random.uuid};MODE=MySQL;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=COMMENT;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop

offerforge:
  admin:
    # 集成测试专用管理员账号（AdminConsoleIntegrationTests 验证身份认定/封禁）
    usernames: admin_tester
  ai:
    provider: mock
  search:
    enabled: false
    embedding-provider: mock
    embedding-dimensions: 64
  interview:
    # 测试用小容量配置，便于快速走完完整面试流程
    max-basics-questions: 1
    max-project-questions: 1
    max-deep-questions: 1
    max-follow-ups: 2
    # 开场追问上限调小：保持既有测试“第 3 次超限推进”语义（生产默认 10，由 LLM 判断话题结束）
    max-opening-follow-ups: 2
    message-window: 12
  training:
    # 测试用小容量配置，便于快速走完专项训练流程
    max-questions: 3
  rate-limit:
    # 集成测试同用户会连续多场面试，放宽限额避免误伤；限流行为由 RateLimitIntegrationTests 专项验证
    interview-ask-limit: 1000
    qa-ask-limit: 1000
    report-limit: 1000
    session-lifecycle-limit: 1000
  quota:
    # 存量集成测试不受额度约束；额度行为由 QuotaIntegrationTests 用属性覆盖专项验证；
    # 计次门槛降为 1：测试环境每阶段 1 题无法凑满生产门槛 5，保证有效场次正常归档；
    # 短场（问答不足门槛）不消耗额度且不记录历史的行为由 QuotaIntegrationTests 覆盖门槛 5 专项验证
    enabled: false
    min-billable-questions: 1
  billing:
    # 存量集成测试不受付费链影响（开关关）；计费链路行为由 BillingIntegrationTests 用属性覆盖专项验证；
    # 高价目 + Mock 客户端固定用量（100 输入/50 输出）：每次调用成本 10+10=20 分，×1.2 = 24 分，确定性可断言
    enabled: false
    provider: mock
    markup: 1.2
    packages:
      - id: pkg-10
        name: "¥10"
        amount-cents: 1000
      - id: pkg-50
        name: "¥50"
        amount-cents: 5000
    models:
      - id: test-free
        name: "测试免费档"
        input-per-million-cents: 100000
        output-per-million-cents: 200000
        paid-only: false
      - id: test-paid
        name: "测试付费档"
        input-per-million-cents: 100000
        output-per-million-cents: 200000
        paid-only: true
  encryption:
    # 测试专用固定密钥（32 字节）
    key: offerforge-test-aes256-gcm-key!!
