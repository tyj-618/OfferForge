spring:
  datasource:
    url: jdbc:h2:mem:offerforge;MODE=MySQL;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=COMMENT;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop

offerforge:
  ai:
    provider: mock
  search:
    enabled: false
    embedding-provider: mock
    embedding-dimensions: 64
  interview:
    # 测试用小容量配置，便于快速走完完整面试流程
    max-basics-questions: 1
    max-project-questions: 1
    max-deep-questions: 1
    max-follow-ups: 2
    message-window: 12
  rate-limit:
    # 集成测试同用户会连续多场面试，放宽限额避免误伤；限流行为由 RateLimitIntegrationTests 专项验证
    interview-ask-limit: 1000
    qa-ask-limit: 1000
    report-limit: 1000
