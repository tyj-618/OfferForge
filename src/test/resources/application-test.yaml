spring:
  datasource:
    # 随机命名内存库：每个 Spring 上下文解析出独立库名（上下文隔离），
    # 且同一上下文的连接池内所有连接共享同一库（匿名库 jdbc:h2:mem: 是每连接私有，与 Hikari 不兼容）；
    # 避免多上下文共享命名库时 create-drop 重置自增 ID 与会话存储交叉污染
    url: jdbc:h2:mem:${random.uuid};MODE=MySQL;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=COMMENT;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop

offerforge:
  ai:
    provider: mock
  search:
    enabled: false
    embedding-provider: mock
    embedding-dimensions: 64
  interview:
    # 测试用小容量配置，便于快速走完完整面试流程
    max-basics-questions: 1
    max-project-questions: 1
    max-deep-questions: 1
    max-follow-ups: 2
    # 开场追问上限调小：保持既有测试“第 3 次超限推进”语义（生产默认 10，由 LLM 判断话题结束）
    max-opening-follow-ups: 2
    message-window: 12
  training:
    # 测试用小容量配置，便于快速走完专项训练流程
    max-questions: 3
  rate-limit:
    # 集成测试同用户会连续多场面试，放宽限额避免误伤；限流行为由 RateLimitIntegrationTests 专项验证
    interview-ask-limit: 1000
    qa-ask-limit: 1000
    report-limit: 1000
  quota:
    # 存量集成测试不受额度约束；额度行为由 QuotaIntegrationTests 用属性覆盖专项验证
    enabled: false
  encryption:
    # 测试专用固定密钥（32 字节）
    key: offerforge-test-aes256-gcm-key!!
