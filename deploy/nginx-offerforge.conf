# Easy Offer Forge 宿主机 Nginx 反代配置（旧域名）
# 放置于 /etc/nginx/conf.d/offerforge.conf
# 放置后执行：nginx -t && nginx -s reload
# 443 证书块由 certbot --nginx 自动管理
# 新域名 easyofferforge.com 的站点配置见 nginx-easyofferforge-site.conf
# （安装于 /etc/nginx/sites-available/easyofferforge，软链到 sites-enabled）

server {
    server_name offerforge.joinuninook.com;

    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 流式输出支持：关闭缓冲、拉长超时
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        chunked_transfer_encoding on;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/offerforge.joinuninook.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/offerforge.joinuninook.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = offerforge.joinuninook.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name offerforge.joinuninook.com;
    return 404; # managed by Certbot
}
