# Easy Offer Forge 宿主机 Nginx 反代配置
# 放置于现有 Nginx 的 conf.d（或 sites-enabled）目录，例如：
#   /etc/nginx/conf.d/offerforge.conf
# 放置后执行：nginx -t && nginx -s reload

server {
    listen 80;
    server_name easyofferforge.com offerforge.joinuninook.com;

    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 流式输出支持：关闭缓冲、拉长超时
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        chunked_transfer_encoding on;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
