# Easy Offer Forge 新域名站点配置
# 安装于 /etc/nginx/sites-available/easyofferforge，软链到 /etc/nginx/sites-enabled/
# Let's Encrypt 证书由 certbot --nginx 签发并自动管理 443/80 跳转
# 与旧域名配置（nginx-offerforge.conf）共存，不可将新域名块同时写入 conf.d，
# 否则 nginx 会报 conflicting server name 警告并忽略重复块

server {
    server_name easyofferforge.com www.easyofferforge.com;
    server_tokens off;
    client_max_body_size 2m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 流式输出支持：关闭缓冲、拉长超时（缺此项会导致面试/专项训练流式断流）
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        chunked_transfer_encoding on;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/easyofferforge.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/easyofferforge.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}
server {
    if ($host = www.easyofferforge.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = easyofferforge.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    server_name easyofferforge.com www.easyofferforge.com;

    listen 80;
    listen [::]:80;
    return 404; # managed by Certbot
}
